name: zekr
description: "Zekr - A professional Islamic mobile application for Quran, Azkar, and Sebha."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Local Notifications
  flutter_local_notifications: ^19.2.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

  # Icons
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/data/quran.json
    - assets/pages/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A4D3A"
  adaptive_icon_foreground: "assets/brand/app_icon_1024.png"
  web:
    generate: true
    image_path: "assets/brand/app_icon_1024.png"
    background_color: "#1A4D3A"
    theme_color: "#1A4D3A"
  windows:
    generate: true
    image_path: "assets/brand/app_icon_1024.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/brand/app_icon_1024.png"

flutter_native_splash:
  color: "#1A4D3A"
  image: assets/brand/splash_portrait_1080x1920.png
  color_dark: "#1A4D3A"
  image_dark: assets/brand/splash_portrait_1080x1920.png
  android_12:
    color: "#1A4D3A"
    image: assets/brand/splash_portrait_1080x1920.png
    color_dark: "#1A4D3A"
    image_dark: assets/brand/splash_portrait_1080x1920.png
  web: false
  fullscreen: true
